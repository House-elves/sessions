# A House Elves elf: what Elf Desk needs to install, set up and run Sessions. AGENTS.md says what each field means.
# It comes with the desk (builtin): it isn't on the + page, and the desk keeps it installed and updates it with itself.
name: sessions
title: Sessions
version: 0.15.0
author: "@phillip-kruger"
description: Named chat sessions with a coding agent (Claude Code or IBM Bob), each working in its own clone of a repo, that you can continue from any device signed in to your desk.
main: Sessions.java
config: ~/.config/sessions/config
tools: [gh]
builtin: true

# What it reads and writes, in plain words: the desk shows these before you install it, so they must be true and
# complete. Name every place outside this machine it reaches, and say when it waits for your click.
reads:
  - Your sessions and their turns, which it keeps on this machine.
  - When you start a session, whether your gh account can see the repo you picked, on GitHub.
  - When the GitHub elf is on your desk, the repos on its board (from the board it saved on this machine, which it only reads), to suggest one for a new session.
  - Each message you send goes to the coding agent you picked for the session, Claude Code or IBM Bob (the runner's, in its sandbox, with no GitHub credentials), which reads and changes its own clone of that repo, and can reach the internet. IBM Bob uses the API key in the runner's settings.
  - Which coding agents are installed on this machine, to offer them for a new session.
  - When you start a session from a todo, that todo in the Todo list's saved list (its description, checklist and issues, which it only reads), as the session's goal for you to read and change before you start.
writes:
  - Your sessions, on this machine. The agent's commits stay in its clone on this machine until you push them.
  - When you push a session (you read its commits and diff first, and confirm in the desk's bar), its commits go to a
    branch on GitHub (session/<its name>, on the repo, or on your fork when you can't push there), with your gh
    account, and the first push opens a draft PR on the repo. Or, if you pick one of the repo's open PRs instead, they
    replace what's on that PR's branch. The agent itself never has GitHub credentials.
  - When the agent asks you to close, comment on or merge one of the session's repo's issues or PRs (it has no GitHub
    access itself), and you click it and confirm in the desk's bar, it does that on GitHub with your gh account.
  - The variables you add in its settings (an API key for what a session builds, say), on this machine only. Every
    session's agent is told their names, and the commands it runs have their values; the agent itself doesn't run
    with them, and the desk only ever shows their names.

settings:
  - key: GITHUB_LOGIN
    label: GitHub account
    help: The account it checks you can read a repo with. Its token comes from gh (gh auth login).
    kind: login
    default: ${github-user}
  - key: CODING_AGENT
    label: Coding agent
    help: The agent a new session starts with; the New session form lets you pick another. Sessions can use Claude Code and IBM Bob.
    kind: agent
    default: claude
  - key: TAGS
    label: Tags
    help: The tags you can put on a session, to sort and filter them, like Personal, Work.
    kind: words
    default: "Personal, Work"
    optional: true

commands:
  list:
    label: List the sessions
    args: []

dry-run: list

# Its tab (and dashboard card), drawn by ui/sessions.js in the desk's sandboxed frame. It reads only your sessions and
# the agents' reports.
tab:
  page: ui/sessions.js
  card: true
  # The variables every session has, drawn by the same page at the top of its Settings pop-up.
  settings: true
data: [sessions, agents, attachments]
# Each turn is an agent; when one ends, the runner calls agent-done with its id, which keeps its reply on the session.
agents:
  done: agent-done

# Almost everything here changes only your sessions on this machine, or starts the sandboxed agent on your own words:
# no asking first. Pushing to GitHub and deleting a session ask.
actions:
  create:
    label: Start a session
    args: [--action=create]
    ask: false
    params:
      # The Todo list (or another elf) may pick the id, to keep its half of a link to it.
      id: {pattern: "(s[0-9]{10,16})?", optional: true}
      name: {pattern: "\\P{Cntrl}{1,80}", max: 80}
      repo: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}", max: 140}
      prompt: {pattern: "[\\s\\S]{1,20000}", max: 20000}
      agent: {one-of: [claude, bob], optional: true}
      # Files you attached to the first message (attach), comma-separated ids.
      files: {pattern: "([0-9a-f]{16}(,[0-9a-f]{16}){0,9})?", optional: true, max: 200}
      link: {pattern: "([a-z0-9][a-z0-9-]{0,40}:[A-Za-z0-9._-]{1,80})?", optional: true, max: 130}
      linkTitle: {pattern: "\\P{Cntrl}{0,300}", optional: true, max: 300}
      # Some of the tags in its settings, comma-separated.
      tags: {pattern: "([A-Za-z0-9 ._*/+#&()-]{1,30}(,[A-Za-z0-9 ._*/+#&()-]{1,30}){0,9})?", optional: true, max: 320}
  new-options:
    label: Suggest repos and agents for a new session
    args: [--action=new-options]
    ask: false
  link-context:
    label: Read the todo a new session starts from
    args: [--action=link-context]
    ask: false
    params:
      link: {pattern: "[a-z0-9][a-z0-9-]{0,40}:[A-Za-z0-9._-]{1,80}", max: 130}
  # While the agent works, a message is queued, and goes when the turn ends (with no text: what you queued, now).
  send:
    label: Send a message
    args: [--action=send]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      text: {pattern: "[\\s\\S]{0,20000}", optional: true, max: 20000}
      files: {pattern: "([0-9a-f]{16}(,[0-9a-f]{16}){0,9})?", optional: true, max: 200}
  attach:
    label: Keep a file you attached to a message
    args: [--action=attach]
    ask: false
    params:
      # A new session's first message has no session yet: its files wait under "new".
      session: {pattern: "(s[0-9]{10,16}|new)"}
      file: {pattern: "([0-9a-f]{16})?", optional: true}
      kind: {one-of: [image, text, pdf, docx]}
      name: {pattern: "[^/\\\\\\p{Cntrl}]{1,120}", max: 120}
      data: {pattern: "[\\s\\S]{0,60000}", max: 60000}
      done: {kind: bool}
  agent-done:
    label: Keep a turn's reply
    args: [--action=agent-done]
    ask: false
    params:
      id: {pattern: "s[0-9]{10,16}-t[0-9]{1,5}"}
  unqueue:
    label: Take a queued message off
    args: [--action=unqueue]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      n: {pattern: "[0-9]", max: 1}
  # ---- pushing a session's work: the preview reads it, the push waits for your click in the desk's bar ----
  push-preview:
    label: Show what a push would send
    args: [--action=push-preview]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      # One of the repo's open PRs to push onto instead of a branch of its own (before the first push).
      pr: {kind: int, optional: true}
  push:
    label: Push a session's commits to GitHub
    args: [--action=push]
    confirm: "Push {commits} to {target} on GitHub, as {as}? The first push also opens a draft PR."
    params:
      session: {pattern: "s[0-9]{10,16}"}
      to: {pattern: "[0-9a-f]{40}", max: 40}
      # For the confirm bar's words; the elf refuses them unless they're what it would push, as whom.
      as: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}", max: 39}
      target: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}:[A-Za-z0-9][A-Za-z0-9._/-]{0,100}", max: 250}
      commits: {pattern: "[0-9]{1,3} commits?", max: 12}
  push-pr:
    label: Push a session's commits onto an open PR
    args: [--action=push-pr]
    confirm: "Replace what's on PR #{pr} ({target}) with {commits} from this session, on GitHub as {as}? The PR's history keeps the old commits."
    params:
      session: {pattern: "s[0-9]{10,16}"}
      pr: {kind: int}
      to: {pattern: "[0-9a-f]{40}", max: 40}
      as: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}", max: 39}
      target: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}:[A-Za-z0-9][A-Za-z0-9._/-]{0,100}", max: 250}
      commits: {pattern: "[0-9]{1,3} commits?", max: 12}
  push-done:
    label: Keep a push, and open its draft PR
    args: [--action=push-done]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      to: {pattern: "[0-9a-f]{40}", max: 40}
      status: {kind: int}
      error: {pattern: "[\\s\\S]*", max: 4000, optional: true}
  # ---- what the agent asks you to do on GitHub, on the session's repo: each waits for your click in the desk's bar ----
  gh-look:
    label: Read an issue or PR the agent asks about
    args: [--action=gh-look]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      number: {kind: int}
  gh-close:
    label: Close an issue or PR the agent asks you to
    args: [--action=gh-close]
    confirm: "Close {repo}#{number} on GitHub, as {as}? {saying}"
    params:
      session: {pattern: "s[0-9]{10,16}"}
      repo: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}", max: 140}
      number: {kind: int}
      as: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}", max: 39}
      comment: {pattern: "[\\s\\S]{0,2000}", max: 2000, optional: true}
      # For the bar's words: the elf refuses it unless it's the comment, word for word.
      saying: {pattern: "[\\s\\S]{1,2100}", max: 2100}
  gh-comment:
    label: Comment on an issue or PR as the agent asks
    args: [--action=gh-comment]
    confirm: "Comment on {repo}#{number} on GitHub, as {as}: “{comment}”?"
    params:
      session: {pattern: "s[0-9]{10,16}"}
      repo: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}", max: 140}
      number: {kind: int}
      as: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}", max: 39}
      comment: {pattern: "[\\s\\S]{1,2000}", max: 2000}
  gh-merge:
    label: Merge a PR the agent asks you to
    args: [--action=gh-merge]
    confirm: "Merge {repo}#{number} on GitHub at {short}, as {as}?"
    params:
      session: {pattern: "s[0-9]{10,16}"}
      repo: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9._-]{1,100}", max: 140}
      number: {kind: int}
      as: {pattern: "[A-Za-z0-9][A-Za-z0-9-]{0,38}", max: 39}
      sha: {pattern: "[0-9a-f]{40}", max: 40}
      short: {pattern: "[0-9a-f]{7}", max: 7}
  # ---- the variables every session has (values written here, never read back by the tab) ----
  vars:
    label: List the session variables' names
    args: [--action=vars]
    ask: false
  var-set:
    label: Add or change a session variable
    args: [--action=var-set]
    ask: false
    params:
      name: {pattern: "[A-Z_][A-Z0-9_]{0,63}", max: 64}
      value: {pattern: "[^\\r\\n\\x00]{1,8192}", max: 8192}
  var-remove:
    label: Remove a session variable
    args: [--action=var-remove]
    ask: false
    params:
      name: {pattern: "[A-Z_][A-Z0-9_]{0,63}", max: 64}
  rename:
    label: Rename a session
    args: [--action=rename]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      name: {pattern: "\\P{Cntrl}{1,80}", max: 80}
  archive:
    label: Archive a session
    args: [--action=archive]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      archived: {kind: bool}
  tag:
    label: Tag a session
    args: [--action=tag]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      tags: {pattern: "([A-Za-z0-9 ._*/+#&()-]{1,30}(,[A-Za-z0-9 ._*/+#&()-]{1,30}){0,9})?", optional: true, max: 320}
  edit-goal:
    label: Edit a session's goal
    args: [--action=edit-goal]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      goal: {pattern: "[\\s\\S]{1,20000}", max: 20000}
  link:
    label: Link a session to a todo
    args: [--action=link]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
      link: {pattern: "[a-z0-9][a-z0-9-]{0,40}:[A-Za-z0-9._-]{1,80}", max: 130}
      linkTitle: {pattern: "\\P{Cntrl}{0,300}", optional: true, max: 300}
  unlink:
    label: Unlink a session's todo
    args: [--action=unlink]
    ask: false
    params:
      session: {pattern: "s[0-9]{10,16}"}
  delete:
    label: Delete a session
    confirm: "Delete the session \"{name}\"? Its chat and its clone go, with any work not pushed."
    args: [--action=delete]
    params:
      session: {pattern: "s[0-9]{10,16}"}
      name: {pattern: "\\P{Cntrl}{1,80}", max: 80}
